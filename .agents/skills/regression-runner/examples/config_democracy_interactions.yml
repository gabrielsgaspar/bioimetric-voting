run_type: "interaction_series"
data_path: "data/clean/lapop/lapop_brazil_with_pca_indices_regression_ready.parquet"
file_format: "parquet"
outcome: "democracy_index_std"
outcome_label: "Trust in democracy"
main_var: "treatment_dummy"
interaction_vars:
  - "female"
  - "white"
  - "married"
  - "low_ed"
controls:
  - "low_ed"
  - "female"
  - "white"
  - "married"
  - "working"
  - "age"
  - "log_gdp_pc"
  - "log_total_pop"
fixed_effects:
  - "municipality_id"
  - "survey_year"
cluster:
  - "municipality_id"
  - "survey_year"
sample_filter: "survey_year <= 2018"
output_dir: "resources/lapop/regressions/democracy_interactions"
figure_output_base: "resources/lapop/figures/democracy_interactions_barplot"
category_labels:
  female: "Female"
  white: "White"
  married: "Married"
  low_ed: "Low Education"
plot_colors:
  "No": "#c79b72"
  "Yes": "saddlebrown"
notes: "Main democracy-index interaction regressions for the LAPOP module."
