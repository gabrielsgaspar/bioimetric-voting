research_description: |
  The paper studies the impact of biometric voter registration (recadastramento
  biometrico) in Brazil on voter composition, voting, trust in institutions,
  institutional legitimacy, and welfare. The initial seed set is exactly the
  bibliography in paper/references/references.bib. The review should prioritize
  papers already in the Obsidian literature network and should focus on
  biometric voter registration, voter ID laws, registration costs, enfranchisement
  and disenfranchisement, voter composition, turnout and voting behavior, trust
  in institutions, political representation, welfare and downstream policy
  consequences, polarization, and institutional legitimacy. The review should
  explain how this paper connects voter-ID and registration-cost literatures to
  evidence on biometric administrative reforms, electoral participation,
  composition of the electorate, political attitudes, and welfare consequences.
